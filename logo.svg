<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient pour le fond (rappelant la couleur bg et surface de ton app) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111518" />
      <stop offset="100%" stop-color="#07090a" />
    </linearGradient>

    <!-- Gradient pour la lettre O (Or profond / Ambre) -->
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a838" />
      <stop offset="100%" stop-color="#c08830" />
    </linearGradient>

    <!-- Gradient pour la lettre C (Beige / Ambre clair) -->
    <linearGradient id="cGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d8c8" />
      <stop offset="100%" stop-color="#e8a838" />
    </linearGradient>

    <!-- Ombre portée pour donner un effet 3D d'entrelacement -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond de l'icône avec coins arrondis typique des apps -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Bordure très subtile autour du fond -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(180, 130, 50, 0.15)" stroke-width="4" />

  <!-- Groupe contenant les lettres, centré -->
  <g transform="translate(-5, 0)">
    <!-- Lettre O -->
    <circle cx="216" cy="256" r="100" fill="none" stroke="url(#oGrad)" stroke-width="48" filter="url(#shadow)" />

    <!-- Lettre C -->
    <!-- Le C est un arc de cercle ouvert sur la droite, il vient mordre sur le O -->
    <path d="M 370 172 A 100 100 0 1 0 370 340" fill="none" stroke="url(#cGrad)" stroke-width="48" stroke-linecap="round" filter="url(#shadow)" />
  </g>
</svg>
